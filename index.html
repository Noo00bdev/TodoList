<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="m-0 p-0 box-border">
    <section class="flex flex-col items-center gap-5 mt-10 bg-blue-500/30 p-3">
        <form id="todo">
            <h1 class="text-2xl font-extrabold font-mono">Todo List</h1>
            <input type="text" placeholder="Add a new task" id="taskInput"  class="p-1.5 rounded-xs border-none outline-none bg-amber-50  placeholder:text-slate-400 focus:ring-2 focus:ring-blue-600/35 transition duration-500 mt-5">
            <button type="submit" id="btnAdd" class="p-1.5 border-none rounded-xs bg-amber-50 hover:bg-blue-600/35 transition duration-500">Add Task</button>
            <button id="del" class="p-1.5 border-none rounded-xs fo bg-amber-50  hover:bg-blue-600/35  transition duration-500">Delete checked</button>
            <button id="delAll" class="p-1.5 border-none rounded-xs fo bg-amber-50  hover:bg-blue-600/35  transition duration-500">Delete ALL</button>
        </form>
        <div>
            <div class="flex flex-row items-center mt-2 gap-2">
                <button class="p-2 rounded-2xl transition duration-300 bg-indigo-700 text-white hover:bg-amber-50 hover:text-black" data-category="checked" id="checked">checked</button>
                <button class="p-2 rounded-2xl transition duration-300  bg-indigo-700 text-white hover:bg-amber-50 hover:text-black" data-category="no-checked" id="no-checked">No checked</button>
            </div>
            
        </div>
    </section>
    <!-- Les listes apparaissent ici -->
    <div id="listItems">
        
    </div>
    <div id="history" class="mt-10 p-3">
        <h2 class="text-center mb-5 ">History</h2>
        <div id="historyItems" class="flex flex-col gap-2">

        </div>

    </div>
    
    <script src="main.js"></script>
</body>
</html>
